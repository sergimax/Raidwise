<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Track raid cooldowns for your characters and dungeons. Manage characters, dungeon lockouts, and cooldown toggles." />
    <meta name="theme-color" content="#fcfbf9" />
    <!-- Sync theme before paint (same key/logic as use-color-mode) to avoid a light flash. -->
    <script>
      (function () {
        var storageKey = "raidwise-color-mode";
        var legacyStorageKey = "my-raid-cds-color-mode";
        var mode = "light";

        try {
          var stored = localStorage.getItem(storageKey);
          if (stored !== "light" && stored !== "dark") {
            stored = localStorage.getItem(legacyStorageKey);
            if (stored === "light" || stored === "dark") {
              localStorage.setItem(storageKey, stored);
              localStorage.removeItem(legacyStorageKey);
            }
          }
          if (stored === "light" || stored === "dark") {
            mode = stored;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            mode = "dark";
          }
        } catch (error) {
          void error;
        }

        // Drives :root[data-color-mode] CSS vars in index.css.
        document.documentElement.dataset.colorMode = mode;
        // Match browser chrome (address bar, etc.) to --page-bg for each mode.
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute("content", mode === "dark" ? "#1a1a1a" : "#fcfbf9");
        }
      })();
    </script>
    <link
      rel="preload"
      href="/raidwise/fonts/onest-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/raidwise/fonts/onest-cyrillic-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="/logo-as-icon.svg" />
    <title>Raidwise – Raid Cooldown Tracker</title>
    <meta property="og:title" content="Raidwise – Raid Cooldown Tracker" />
    <meta property="og:description" content="Track raid cooldowns for your characters and dungeons. Manage characters, dungeon lockouts, and cooldown toggles." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
