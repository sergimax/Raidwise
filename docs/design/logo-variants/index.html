<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Raidwise logo variants (temporary)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #12141a;
        --panel: #1a1f2a;
        --ink: #f0eadf;
        --muted: #9aa3b2;
        --gold: #eda71b;
        --navy: #0c1728;
        --line: #2a3344;
        --header-logo: 28px;
        --favicon-16: 16px;
        --favicon-32: 32px;
        --original: 240px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: radial-gradient(
          1200px 600px at 50% -10%,
          #243049 0%,
          var(--bg) 55%
        );
        color: var(--ink);
        line-height: 1.4;
      }

      header {
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.25rem 1rem;
      }

      header h1 {
        margin: 0 0 0.35rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.75rem;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 1.25rem 3rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      article {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }

      .meta {
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--line);
      }

      .meta h2 {
        margin: 0 0 0.2rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.05rem;
      }

      .meta p {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .meta code {
        font-size: 0.75rem;
        color: var(--gold);
      }

      .scales {
        display: grid;
        grid-template-columns: minmax(200px, 1.2fr) minmax(160px, 0.7fr) minmax(
            220px,
            1fr
          );
        gap: 0;
      }

      @media (max-width: 800px) {
        .scales {
          grid-template-columns: 1fr;
        }
      }

      .scale {
        padding: 1rem;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 100%;
      }

      .scale:last-child {
        border-right: 0;
      }

      @media (max-width: 800px) {
        .scale {
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .scale:last-child {
          border-bottom: 0;
        }
      }

      .scale-label {
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .scale-label strong {
        color: var(--ink);
        font-weight: 600;
        text-transform: none;
        letter-spacing: 0;
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.15rem;
      }

      .stage {
        flex: 1;
        display: grid;
        place-items: center;
        background:
          linear-gradient(45deg, #161b25 25%, transparent 25%) 0 0 / 12px 12px,
          linear-gradient(-45deg, #161b25 25%, transparent 25%) 0 0 / 12px 12px,
          var(--navy);
        border-radius: 10px;
        padding: 1rem;
        min-height: 160px;
      }

      .stage-favicon {
        min-height: 120px;
        gap: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }

      .favicon-pair {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
      }

      .favicon-pair span {
        font-size: 0.7rem;
        color: var(--muted);
      }

      .stage-header {
        width: 100%;
        min-height: 120px;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        gap: 0.5rem;
        background: transparent;
        padding: 0;
      }

      .mock-header {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fcfbf9;
        color: #0a0a0a;
        border: 1px solid #e7e5e4;
      }

      .mock-header.dark {
        background: #1a1a1a;
        color: #fafafa;
        border-color: #333;
      }

      .mock-header img {
        width: var(--header-logo);
        height: var(--header-logo);
        object-fit: contain;
        flex-shrink: 0;
        display: block;
      }

      .mock-title {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 700;
        font-size: 1.2rem;
        color: #9a3412;
        white-space: nowrap;
      }

      .mock-header.dark .mock-title {
        color: #fb923c;
      }

      .mock-spacer {
        flex: 1;
        height: 8px;
        border-radius: 999px;
        background: #e7e5e4;
        opacity: 0.7;
      }

      .mock-header.dark .mock-spacer {
        background: #333;
      }

      .asset {
        display: block;
        object-fit: contain;
      }

      .asset-original {
        width: var(--original);
        height: var(--original);
        max-width: 100%;
      }

      article.wide .asset-original {
        width: min(100%, 420px);
        height: auto;
        aspect-ratio: 16 / 9;
      }

      .asset-favicon-16 {
        width: var(--favicon-16);
        height: var(--favicon-16);
      }

      .asset-favicon-32 {
        width: var(--favicon-32);
        height: var(--favicon-32);
      }

      footer {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 1.25rem 2.5rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Raidwise logo variants</h1>
      <p>
        Temporary scale gallery (PNG concepts only). Each card: original,
        browser-icon sizes (16 / 32), and header logo size (28px, matching
        <code>AppHeader</code>).
      </p>
    </header>

    <main id="gallery"></main>

    <footer>
      PNG concept renders only. Convert the chosen mark manually to
      <code>logo-as-icon.svg</code> (favicon) and <code>logo.svg</code> (header,
      28x28).
    </footer>

    <script>
      const variants = [
        {
          id: "A",
          title: "Full wordmark",
          note: "Raidwise in the seal",
          png: "raidwise-logo-variant-a-wordmark.png",
        },
        {
          id: "B",
          title: "RW monogram",
          note: "Icon / favicon candidate",
          png: "raidwise-logo-variant-b-rw-monogram.png",
        },
        {
          id: "C",
          title: "Stacked RAID / WISE",
          note: "Two-line seal wordmark",
          png: "raidwise-logo-variant-c-stacked.png",
        },
        {
          id: "D",
          title: "Seal R + lockup",
          note: "Wide header companion",
          png: "raidwise-logo-variant-d-lockup.png",
          wide: true,
        },
        {
          id: "E",
          title: "Dominant R",
          note: "Big R + arched AIDWISE",
          png: "raidwise-logo-variant-e-r-dominant.png",
        },
        {
          id: "F",
          title: "RW + cooldown arc",
          note: "Symbol accent for icon",
          png: "raidwise-logo-variant-f-rw-symbol.png",
        },
        {
          id: "G",
          title: "Arc type",
          note: "RAID / WISE on arcs",
          png: "raidwise-logo-variant-g-arc-type.png",
        },
        {
          id: "H",
          title: "Raid.wise",
          note: "Middle-dot split wordmark",
          png: "raidwise-logo-variant-h-dot-split.png",
        },
        {
          id: "I",
          title: "Stencil R",
          note: "Cream disk / negative space",
          png: "raidwise-logo-variant-i-stencil-r.png",
        },
        {
          id: "J",
          title: "Wordmark banner",
          note: "No seal - header banner",
          png: "raidwise-logo-variant-j-wordmark-banner.png",
          wide: true,
        },
      ];

      const gallery = document.getElementById("gallery");

      for (const variant of variants) {
        const article = document.createElement("article");
        if (variant.wide) article.classList.add("wide");

        article.innerHTML = `
          <div class="meta">
            <h2>${variant.id} - ${variant.title}</h2>
            <p>${variant.note}</p>
            <p><code>${variant.png}</code></p>
          </div>
          <div class="scales">
            <section class="scale">
              <div class="scale-label">
                <strong>Original</strong>
                Large preview (~240px)
              </div>
              <div class="stage">
                <img class="asset asset-original" src="${variant.png}" alt="Variant ${variant.id} original" />
              </div>
            </section>

            <section class="scale">
              <div class="scale-label">
                <strong>Browser icon</strong>
                Favicon tab sizes (16 / 32)
              </div>
              <div class="stage stage-favicon">
                <div class="favicon-pair">
                  <img class="asset asset-favicon-16" src="${variant.png}" alt="" />
                  <span>16x16</span>
                </div>
                <div class="favicon-pair">
                  <img class="asset asset-favicon-32" src="${variant.png}" alt="" />
                  <span>32x32</span>
                </div>
              </div>
            </section>

            <section class="scale">
              <div class="scale-label">
                <strong>Header logo</strong>
                AppHeader size (28x28)
              </div>
              <div class="stage stage-header">
                <div class="mock-header">
                  <img src="${variant.png}" alt="" />
                  <span class="mock-title">Raidwise</span>
                  <span class="mock-spacer" aria-hidden="true"></span>
                </div>
                <div class="mock-header dark">
                  <img src="${variant.png}" alt="" />
                  <span class="mock-title">Raidwise</span>
                  <span class="mock-spacer" aria-hidden="true"></span>
                </div>
              </div>
            </section>
          </div>
        `;

        gallery.appendChild(article);
      }
    </script>
  </body>
</html>
